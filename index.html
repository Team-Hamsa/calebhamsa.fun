<!DOCTYPE html>
<!--
  index.html: Caleb's homepage.

  This file says WHAT is on the page: a big title, six blocks that link
  to the toys, and a list of favorite things. How it LOOKS comes from
  css/blocks.css. Its only JavaScript is one line at the
  bottom that starts the offline helper.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes phones show the page at its real size instead of zoomed out. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Caleb's Blocky World </title>
  <!-- Icons: the browser tab, the iPad home screen, and old browsers.
       All drawn from img/icon-pixels.txt by tools/make-icons.js. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <!-- The app manifest lets the site be added to the home screen and open
       full-screen like an app (see manifest.webmanifest). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#7ec8ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Caleb">
  <meta name="description" content="Caleb's blocky corner of the internet: music blocks with chords and scales, drawing, and print and cursive handwriting practice.">
  <!-- Sharing previews: the card that shows up when the link is texted or
       posted. These must be full https:// addresses, not "img/...".
       Apps remember the picture, so after changing share-card.png, bump
       the ?v= number to make them fetch the new one. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Caleb's Blocky World">
  <meta property="og:title" content="Caleb's Blocky World">
  <meta property="og:description" content="Caleb's blocky corner of the internet: music blocks with chords and scales, drawing, and print and cursive handwriting practice.">
  <meta property="og:url" content="https://calebhamsa.fun/">
  <meta property="og:image" content="https://calebhamsa.fun/img/share-card.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="HI, I'M CALEB! with music, draw, write and build blocks on grass">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The pixel font, from Google Fonts (free to use). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- crossorigin lets the offline helper (sw.js) save this, so the font works offline too. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" crossorigin>
  <link rel="stylesheet" href="css/blocks.css">
</head>
<body class="home-page">
  <!-- Drifting clouds. aria-hidden: screen readers skip decoration. -->
  <div class="sky" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
  </div>

  <main>
    <!-- 🧪 Try this! Change the words in the title. -->
    <h1 class="title">HI, I'M CALEB!</h1>

    <nav class="big-blocks" aria-label="Toys">
      <a class="block big grass" href="music.html"><span class="icon">🎵</span>MUSIC</a>
      <a class="block big gold" href="draw.html"><span class="icon">🎨</span>DRAW</a>
      <!-- "?mode=trace" tells the drawing page to open in tracing mode. -->
      <a class="block big dirt" href="draw.html?mode=trace"><span class="icon">✍️</span>WRITE</a>
      <a class="block big" href="build.html"><span class="icon">⛏️</span>BUILD</a>
      <a class="block big chem" href="chem.html"><span class="icon">🧪</span>CHEMISTRY</a>
      <a class="block big obsidian" href="type.html"><span class="icon">⌨️</span>TYPING</a>
    </nav>

    <section class="favorites">
      <h2>My favorite things</h2>
      <!-- 🧪 Try this! Ask Caleb for a new favorite and add a line: <li>🦖 dinosaurs</li> -->
      <ul>
        <li>🎵 music</li>
        <li>🎨 drawing</li>
        <li>✍️ writing</li>
        <li><a href="build.html">⛏️ building with blocks</a></li>
        <li><a href="chem.html">🧪 making molecules</a></li>
        <li><a href="type.html">⌨️ finding the keys</a></li>
      </ul>
    </section>
  </main>

  <footer class="ground" aria-hidden="true">
    <div class="grass-strip"></div>
    <div class="dirt-strip"></div>
  </footer>

  <!-- Start the offline helper (see js/pwa.js and sw.js). -->
  <script type="module">
    import { registerServiceWorker } from './js/pwa.js';
    registerServiceWorker();
  </script>
</body>
</html>
